# ============================================================
# Gold Trading Bot — Master Configuration
# ============================================================
# All monetary values assume USD. XAUUSD quotes are price-per-ounce.

general:
  symbol: "XAUUSD"
  timeframe: "1h"          # 1m, 5m, 15m, 1h, 4h, 1d
  timezone: "UTC"
  live_trading_enabled: false   # HARD GATE — never set true without passing all checks

data:
  provider: "tradingview"       # tradingview | yfinance | csv | oanda
  tradingview_symbol: "XAUUSD"
  tradingview_exchange: "OANDA"
  csv_path: "./data/xauusd.csv"
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  train_pct: 0.60
  val_pct: 0.20
  test_pct: 0.20

costs:
  spread_points: 0.30          # typical retail XAUUSD spread in USD
  commission_per_lot: 0.0      # many brokers embed cost in spread
  slippage_points: 0.10        # conservative slippage assumption
  lot_size_oz: 100             # 1 standard lot = 100 oz

risk:
  risk_per_trade_pct: 0.0025   # 0.25% of equity per trade (conservative)
  max_risk_per_trade_pct: 0.005  # hard cap 0.5%
  max_daily_drawdown_pct: 0.02   # 2% daily loss limit — stops all new trades
  max_total_drawdown_pct: 0.10   # 10% total drawdown — full kill switch
  max_open_positions: 2
  max_correlation_exposure: 1    # since we only trade one instrument
  volatility_lookback: 20       # bars for ATR / volatility calc
  no_trade_during_news: true    # flat during configured news events
  kill_switch:
    max_spread_multiple: 3.0    # kill if spread > 3x normal
    max_consecutive_losses: 8
    max_data_gap_seconds: 345600  # 4 days in seconds (weekends + holidays for daily bars)

strategies:
  trend_following:
    enabled: true
    fast_ma: 10
    slow_ma: 30
    atr_period: 14
    atr_stop_multiple: 2.0
    trailing_stop_atr_multiple: 1.5
    regime_ma: 100             # long-term regime filter (daily)

  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    zscore_entry: -1.5
    zscore_exit: 0.0
    volatility_filter_period: 20
    min_volatility_percentile: 10
    max_volatility_percentile: 90

  breakout:
    enabled: true               # session-based; requires intraday data (1h via TradingView)
    asian_session_start: "00:00"
    asian_session_end: "08:00"
    london_open: "08:00"
    ny_open: "13:00"
    breakout_buffer_pct: 0.001
    confirmation_bars: 2
    atr_period: 14
    stop_atr_multiple: 1.5

  momentum:
    enabled: true
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    adx_period: 14
    adx_threshold: 20              # lowered for daily bars

  # --- New strategies ---
  multi_timeframe:
    enabled: true
    max_daily_trades: 5

  ichimoku_cloud:
    enabled: true
    tenkan_period: 9
    kijun_period: 26
    senkou_b_period: 52
    atr_stop_multiple: 2.0

  rsi_divergence:
    enabled: true
    rsi_period: 14
    lookback: 20
    atr_stop_multiple: 2.5

  volume_price:
    enabled: true
    volume_spike_multiple: 1.5
    atr_stop_multiple: 2.0

  stochastic_rsi:
    enabled: true
    stoch_k: 14
    stoch_d: 3
    rsi_period: 14
    atr_stop_multiple: 2.0

  momentum_trend:
    enabled: true
    fast_ma: 10
    slow_ma: 30
    regime_ma: 100
    rsi_period: 14
    atr_stop_multiple: 2.0

  session_momentum:
    enabled: true
    asian_start: 0
    asian_end: 8
    london_start: 8
    london_end: 16
    min_asian_move_pct: 0.001
    atr_stop_multiple: 1.5

  volatility_breakout:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    keltner_multiple: 1.5
    atr_stop_multiple: 2.0

  triple_ema:
    enabled: true
    fast_ema: 8
    mid_ema: 21
    slow_ema: 55
    atr_stop_multiple: 2.0

  smart_money:
    enabled: true
    swing_lookback: 10
    atr_stop_multiple: 2.0

  ensemble:
    enabled: true
    min_agreement: 2               # minimum strategies that must agree
    weight_by_recent_sharpe: true
    lookback_for_weights: 60       # bars to compute rolling sharpe

backtest:
  initial_equity: 100000.0
  walk_forward:
    in_sample_bars: 1000
    out_of_sample_bars: 250
    step_bars: 250
  monte_carlo:
    n_simulations: 1000
    confidence_level: 0.95
    resample_returns: true
    shuffle_trades: true

paper_trade:
  initial_equity: 100000.0
  update_interval_seconds: 60     # how often to check for signals
  min_weeks_before_review: 4      # minimum paper trading duration
  log_every_signal: true
  log_rejections: true

  # --- Cross-market strategies ---
  dxy_divergence:
    enabled: true
    dxy_zscore_threshold: 1.5
    atr_stop_multiple: 2.0
    lookback: 20

  silver_lead:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    atr_stop_multiple: 2.0

  vix_spike:
    enabled: true
    vix_spike_pct: 20
    vix_absolute_level: 25
    atr_stop_multiple: 1.5

  copper_gold_ratio:
    enabled: true
    zscore_threshold: 1.5
    lookback: 30
    atr_stop_multiple: 2.0

  oil_gold_inflation:
    enabled: true
    oil_rally_threshold: 0.03
    lookback: 5
    atr_stop_multiple: 2.0

  btc_gold_flow:
    enabled: true
    btc_drop_pct: -3.0
    atr_stop_multiple: 2.0

  real_yield:
    enabled: true
    yield_change_threshold: -0.05
    lookback: 10
    atr_stop_multiple: 2.0

  asian_session_setup:
    enabled: true
    asian_start: 0
    asian_end: 8
    confirmation_bars: 2
    atr_stop_multiple: 1.5

  monday_gap:
    enabled: true
    min_gap_pct: 0.003
    atr_stop_multiple: 1.5

  round_number:
    enabled: true
    round_interval: 50
    proximity_atr: 0.5
    atr_stop_multiple: 2.0

  india_seasonal:
    enabled: true

  multi_market_momentum:
    enabled: true
    ema_fast: 20
    ema_slow: 50
    atr_stop_multiple: 2.0

# Capital & risk (YVPH discipline)
capital:
  initial: 1000.0
  risk_pct: 0.02           # 2% per trade
  max_daily_loss: 60.0     # hard dollar stop

# Discipline & lifecycle
discipline:
  max_trades_per_day: 4
  max_loss_streak: 3        # stop after 3 consecutive losses
  max_live_trades_per_day: 4
  max_concurrent_positions: 2
  max_daily_drawdown_pct: 6.0
  max_weekly_drawdown_pct: 12.0
  min_confidence_to_trade: 0.60    # lowered from 0.71 for paper trading — need data to learn
  min_rr_ratio: 2.5         # 1:2.5 minimum R:R

lifecycle:
  backtest_min_win_rate: 0.55
  backtest_min_profit_factor: 1.3
  paper_min_win_rate: 0.60
  paper_min_rr: 1.5
  paper_min_signals: 20
  paper_max_consecutive_losses: 5
  live_demotion_win_rate: 0.55
  live_demotion_min_trades: 50
  retire_win_rate: 0.50
  retire_min_trades: 50

deployment_gate:
  min_oos_sharpe: 0.5
  max_oos_drawdown_pct: 0.15
  min_profit_factor: 1.2
  max_backtest_paper_deviation_pct: 0.30  # 30% tolerance
  min_regime_count: 3             # must be tested across 3+ regimes
  require_all_pass: true
