[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nqlab"
version = "0.0.1"
description = "NQ/MNQ futures quantitative research platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "nqlab" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "polars>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
nqlab = "nqlab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nqlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N818"]  # allow ContractError name without "Error" pedantry conflicts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

# C-extension data libs ship partial/awkward stubs; treat as untyped (Any) so
# strict mode does not flag every vendor call, while our own code stays strict.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "polars", "polars.*", "duckdb", "duckdb.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nqlab.*"]
