# Base configuration. Layered loading order (later overrides earlier):
#   base.yaml -> instruments/nq.yaml -> roll/volume.yaml
#   -> profiles/<profile>.yaml -> explicit overrides -> environment
#
# Paths are configurable. raw/ is IMMUTABLE and never written to.

data:
  # Root of the raw, immutable market data (Databento NQ futures).
  nq_data_root: "/Volumes/T9/nq data"
  raw_subdir: raw
  trades_subdir: trades
  mbp1_subdir: mbp1
  # Derived/curated layers live OUTSIDE raw/. Configurable so it can move to
  # a local NVMe later without touching code.
  curated_root: "/Volumes/T9/nq data/curated"
  catalog_path: "/Volumes/T9/nq data/curated/catalog.duckdb"
  artifacts_root: "/Volumes/T9/nq data/curated/artifacts"

# Canonical information-availability clock. ts_recv = feed arrival (look-ahead
# safe). ts_event + sequence are used ONLY for intra-instrument ordering.
clock:
  canonical: ts_recv
  ordering: [ts_event, sequence]

logging:
  level: INFO
  format: console        # console | json
  include_timestamp: true

compute:
  max_workers: null              # null => auto
  manifest_sample_row_groups: 4  # row groups sampled per file for instrument discovery

# Roll defaults (canonical roll config is in roll/volume.yaml, which overrides this).
roll:
  method: volume
  adjustment: back_adjusted
  calendar_guard_days: 8
  roll_offset_days: 0
  min_front_volume_ratio: 1.0
