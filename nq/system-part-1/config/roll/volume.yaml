# Canonical roll configuration (approved): volume-based roll with a calendar
# guard, producing a back-adjusted continuous contract for research. Raw
# per-contract data is always preserved for execution realism.
#
# Phase 0 defines the config + interfaces only; the scheduler is implemented in
# Phase 2 (see src/nqlab/domain/instruments/roll.py).
roll:
  method: volume               # volume | calendar | open_interest
  adjustment: back_adjusted    # back_adjusted | ratio | none
  # Never hold a contract within this many calendar days of expiry (safety net
  # even if volume has not yet migrated).
  calendar_guard_days: 8
  # Optional shift applied to a volume-triggered roll date.
  roll_offset_days: 0
  # Roll to the next contract once next-month volume exceeds front-month volume
  # by this ratio (1.0 = strictly greater).
  min_front_volume_ratio: 1.0
