# Phase 40 — FROZEN forward-paper config for clean5+gate. NOT FOR LIVE TRADING.
# Frozen 2026-06-28 from Phase 39 lead. No parameter is to be changed during forward-paper.
name: clean5_gate
status: forward_paper_only        # paper only; live disabled
live_trading: false
instrument: MNQ
session: RTH                       # 09:30-15:55 ET, EOD-flat at 15:55
account_model: topstep_150k       # profit_target 9000, trailing_max_loss 4500 (intraday, locked at start)
costs:
  commission_per_side_usd: 0.25   # MNQ, full
  entry_slippage_ticks: 1         # adverse, on next-bar-open entry
  exit_slippage_ticks: 1          # adverse, on stop / EOD-flat
  target_fill: exact_limit        # resting limit; harsh stress assumes touch-only miss (-1 tick)

# ---- regime gate (PIT-safe, evaluated at the FIRST RTH bar of the day) ----
gate:
  rule: skip_day_if_neutral_trend
  definition: "trade the day ONLY if htf_bull==1 OR htf_bear==1 at 09:30 ET; if htf is neither
               (neutral), take NO trades that day. ~15% of days skipped -> ~85% of days traded."

# ---- daily exposure ----
sizing:
  per_signal_contracts: 1         # 1 MNQ per sleeve signal
  max_trades_per_day:
    SAFE: 2                        # <=2 MNQ/day  (lowest blow; more concentrated in trend sleeve)
    BALANCED: 3                    # <=3 MNQ/day  (recommended; better diversified, higher payout)
  selection: first_n_by_time      # if >cap signals fire, take the earliest by entry timestamp
  one_trade_per_sleeve_per_day: true

# ---- the 5 frozen sleeves (each: first signal/day, next-bar-open entry, EOD-flat) ----
sleeves:
  - name: trend_adx_cont
    stop_atr: 2.0
    exit: EOD
    long:  "RTH 09:30-15:00 AND adx>25 AND trend_1h_bull AND close>vwap_session AND close>prev_close"
    short: "RTH 09:30-15:00 AND adx>25 AND htf_bear   AND close<vwap_session AND close<prev_close"
  - name: ir90_break
    stop_atr: 2.0
    exit: EOD
    long:  "11:00-14:30 AND close crosses ABOVE the 09:30-11:00 (first-90-min) high"
    short: "11:00-14:30 AND close crosses BELOW the 09:30-11:00 (first-90-min) low"
  - name: asia_sweep_fade
    stop_atr: 1.5
    exit: target_2R
    long:  "RTH AND bar low < Asia-session low AND close > Asia-session low  (sweep + reclaim up)"
    short: "RTH AND bar high > Asia-session high AND close < Asia-session high (sweep + reclaim down)"
  - name: ir60_fade
    stop_atr: 1.5
    exit: target_2R
    short: "10:30-14:00 AND bar high > 09:30-10:30 (first-60-min) high AND close back below it"
    long:  "10:30-14:00 AND bar low  < 09:30-10:30 (first-60-min) low  AND close back above it"
  - name: disp_pb_fvg
    stop_atr: 1.5
    exit: target_2R
    long:  "RTH AND displacement bar AND price inside a bull FVG AND up-bar"
    short: "RTH AND displacement bar AND price inside a bear FVG AND down-bar"

# ---- watch-items during forward-paper (Phase 40 yellow flags) ----
watch:
  - "trend_adx_cont contributes ~42% (BALANCED) / ~52% (SAFE) of gross profit -> watch single-sleeve dependence"
  - "2023 was a losing year (-1.9K BALANCED) -> low-vol grind regimes are the weak spot"
  - "under harsh fills the real-path 120-day payout/blow dips to ~1.44 -> plan to harsh numbers"
