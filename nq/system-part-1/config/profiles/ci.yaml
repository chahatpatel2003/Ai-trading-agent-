# CI profile: hermetic paths so tests/checks never depend on the external SSD.
# Tests typically override nq_data_root with a temp fixture tree anyway.
data:
  nq_data_root: "./.ci_fixtures/nqdata"
  curated_root: "./.ci_fixtures/curated"
  catalog_path: "./.ci_fixtures/curated/catalog.duckdb"
  artifacts_root: "./.ci_fixtures/curated/artifacts"
logging:
  level: WARNING
  format: json
