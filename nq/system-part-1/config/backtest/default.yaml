# Minimal backtester execution + risk defaults (all cutoffs in ET).
backtest:
  timeframe: "5m"
  risk_per_trade_usd: 250.0
  slippage_ticks: 1.0
  default_stop_atr: 1.5
  default_target_atr: 2.0
  time_stop_bars: 90
  rth_only: true
  allow_overnight: false
  no_new_trade_primary_et: "12:30"   # primary tests: no new entries after 12:30
  no_new_trade_hard_et: "15:50"      # hard cutoff regardless of strategy
  force_flat_et: "15:55"             # force flat before the Topstep close
