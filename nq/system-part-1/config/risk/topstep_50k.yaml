# Topstep 50K Trading Combine (rules in config, never hardcoded).
topstep:
  name: "50K"
  account_size: 50000.0
  profit_target: 3000.0
  trailing_max_loss: 2000.0
  trailing_basis: intraday
  lock_trailing_at_start: true
  daily_loss_limit: null      # combine has no separate daily loss limit by default
  max_contracts: 5
  min_trading_days: 2
  consistency_pct: 0.5        # best day must be <= 50% of total profit
