# Contract specifications. These are exchange facts (stable).
instruments:
  NQ:
    name: "E-mini Nasdaq-100"
    exchange: "CME"
    currency: "USD"
    tick_size: 0.25
    tick_value: 5.00          # $ per tick per contract
    point_value: 20.00        # $ per index point per contract
    micro: "MNQ"
    databento_symbol_roots: ["NQ"]
    spread_symbol_marker: "-" # symbols containing '-' are calendar spreads -> exclude

  MNQ:
    name: "Micro E-mini Nasdaq-100"
    exchange: "CME"
    currency: "USD"
    tick_size: 0.25
    tick_value: 0.50
    point_value: 2.00
    micro_of: "NQ"
    micros_per_mini: 10

  GC:
    name: "COMEX Gold"
    exchange: "COMEX"
    currency: "USD"
    tick_size: 0.10
    tick_value: 10.00
    point_value: 100.00       # $ per $1/oz move per contract (100 oz)
    micro: "MGC"
    databento_symbol_roots: ["GC"]
    spread_symbol_marker: "-"

  MGC:
    name: "Micro Gold"
    exchange: "COMEX"
    currency: "USD"
    tick_size: 0.10
    tick_value: 1.00
    point_value: 10.00        # 10 oz
    micro_of: "GC"
    micros_per_mini: 10
