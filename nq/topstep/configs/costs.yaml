# Per-side trading costs and friction model.
#
# Commissions/fees VERIFIED 2026-07-02 against the official TopstepX schedule
# (help.topstep.com article 8284213). Official round-turn totals:
#   NQ $3.80 | MNQ $1.24 | GC $4.24 | MGC $1.74
# Structure: minis $0.50/side commission, micros $0.25/side, + exchange fee,
# + $0.04 NFA per round turn ($0.02/side). Per-side exchange fee derived from
# the published RT totals.
#
# Spread/slippage assumptions remain conservative estimates (verified: false
# would apply to those fields only; the `verified` flag below covers fees).
costs:
  NQ:
    commission_per_side: 0.50
    exchange_fee_per_side: 1.38
    regulatory_fee_per_side: 0.02
    spread_ticks_rth: 1            # typical top-of-book spread, regular hours
    spread_ticks_overnight: 1
    slippage_ticks_market: 1       # extra ticks beyond half-spread, per market side (conservative)
    slippage_ticks_stop: 2         # stops fill worse
    verified: true

  MNQ:
    commission_per_side: 0.25
    exchange_fee_per_side: 0.35
    regulatory_fee_per_side: 0.02
    spread_ticks_rth: 1
    spread_ticks_overnight: 2
    slippage_ticks_market: 1
    slippage_ticks_stop: 2
    verified: true

  GC:
    commission_per_side: 0.50
    exchange_fee_per_side: 1.60
    regulatory_fee_per_side: 0.02
    spread_ticks_rth: 1
    spread_ticks_overnight: 2
    slippage_ticks_market: 1
    slippage_ticks_stop: 2
    verified: true

  MGC:
    commission_per_side: 0.25
    exchange_fee_per_side: 0.60
    regulatory_fee_per_side: 0.02
    spread_ticks_rth: 1
    spread_ticks_overnight: 2
    slippage_ticks_market: 1
    slippage_ticks_stop: 2
    verified: true

# Fill model to use per data kind. "bar_conservative": fills at bar prices
# adjusted by spread+slippage; "book": fills against recorded MBP-1 quotes
# (available for NQ; strictly better realism, implemented later).
fill_models:
  ohlcv_1m: "bar_conservative"
  mbp1: "book"
  trades: "bar_conservative"
