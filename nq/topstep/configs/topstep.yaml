# Topstep account model.
# Verified against live help.topstep.com / topstep.com articles on 2026-07-02
# (see outputs/topstep_rules_verification.md for sources and quotes).
# verified: true blocks were confirmed against a live official page.

combine:
  accounts:
    "50k":
      start_balance: 50000
      profit_target: 3000
      mll: 2000                 # Maximum Loss Limit (trailing) — distance from start
      dll: 1000                 # Topstep DLL if enabled (optional at checkout)
      max_contracts_minis: 5
      max_contracts_micros: 50
    "100k":
      start_balance: 100000
      profit_target: 6000
      mll: 3000
      dll: 2000
      max_contracts_minis: 10
      max_contracts_micros: 100
    "150k":
      start_balance: 150000
      profit_target: 9000
      mll: 4500
      dll: 3000
      max_contracts_minis: 15
      max_contracts_micros: 150
  rules:
    mll_mode: "eod_trailing"          # level ratchets on end-of-day balance highs, never down
    mll_stops_at_start_balance: true  # locks permanently once it reaches start balance
    mll_check: "realtime"             # monitored real-time vs equity (realized + unrealized)
    dll_optional: true                # DLL is opt-in (checkout or Risk Settings PDLL)
    dll_includes_open_pnl: true       # triggered on Net P&L
    dll_breach_policy: "lockout"      # soft: flatten + locked out until 17:00 CT, not a failure
    min_trading_days: 2               # cannot pass in one day
    # Consistency Target: best day must stay <= 50% of profit target; exceeding
    # it is NOT a failure — the target grows to best_day / 0.50.
    consistency_best_day_max_pct_of_target: 0.50
    micros_per_mini_ratio: 10         # position limits count 10 micros = 1 mini (Combine/XFA)
    verified: true

funded:
  # Express Funded Account (XFA). Official display: balance starts at $0 with
  # MLL at -mll, locking at $0. The simulator keeps combine coordinates
  # (start_balance offset) — mathematically identical.
  rules:
    monthly_fee: 0                    # no subscription once funded
    mll_mode: "eod_trailing"
    mll_stops_at_start_balance: true  # == "locks at $0" in XFA coordinates
    mll_check: "realtime"
    dll_breach_policy: "lockout"
    can_reset: false                  # resets are combine-only
    back2funded_fee: { "50k": 599, "100k": 699, "150k": 829 }  # <=2x, only before 1st payout, within 30d
    # Scaling plan: max mini-equivalent lots by CURRENT XFA balance (= profit
    # in simulator coordinates). Updates next session only. balance_below is
    # an exclusive upper bound; null = no bound (top tier).
    scaling_plan:
      "50k":
        - { balance_below: 1500, max_minis: 2 }
        - { balance_below: 2000, max_minis: 3 }
        - { balance_below: null, max_minis: 5 }
      "100k":
        - { balance_below: 1500, max_minis: 3 }
        - { balance_below: 2000, max_minis: 4 }
        - { balance_below: 3000, max_minis: 5 }
        - { balance_below: null, max_minis: 10 }
      "150k":
        - { balance_below: 1500, max_minis: 3 }
        - { balance_below: 2000, max_minis: 4 }
        - { balance_below: 3000, max_minis: 5 }
        - { balance_below: 4500, max_minis: 10 }
        - { balance_below: null, max_minis: 15 }
    verified: true
  payout:
    # XFA "Standard" payout path (chosen at activation, irrevocable). The
    # alternative "Consistency" path (3 trading days + largest day <= 40% of
    # net profit) is noted for later comparison but not simulated yet.
    path: "standard"
    min_winning_days: 5               # per payout cycle
    winning_day_min_profit: 150.0     # a winning day is >= $150 net P&L (NOT $200)
    require_positive_since_last_payout: true   # first payout exempt
    winning_day_counter_resets_after_payout: true
    max_pct_of_balance: 0.50          # per request, of XFA balance (= profit buffer)
    per_payout_cap:                   # XFA Standard-path caps per request
      "50k": 2000
      "100k": 3000
      "150k": 5000
    per_payout_cap_consistency_path:  # informational
      "50k": 3000
      "100k": 4000
      "150k": 6000
    dll_at_checkout_doubles_caps: true   # promo active since 2026-06-02
    min_payout: 125.0
    profit_split_trader: 0.90         # trader keeps 90% (joined >= 2026-01-12)
    mll_locks_at_zero_after_first_payout: true   # floor = start balance forever after
    # LFA (Live Funded) stage exists beyond XFA: uncapped payouts, 100% access
    # after 30 LFA winning days. Not modeled in the foundation.
    verified: true

pricing:
  # Confirmed identical to user-supplied numbers (2026-07-02).
  standard:
    "50k":  { monthly: 49,  activation: 149 }
    "100k": { monthly: 99,  activation: 149 }
    "150k": { monthly: 199, activation: 149 }
  no_activation_fee:
    "50k":  { monthly: 95,  activation: 0 }
    "100k": { monthly: 149, activation: 0 }
    "150k": { monthly: 229, activation: 0 }
  # A combine reset costs the account's monthly rebill price (also pushes the
  # rebill date out 30 days; max 2 resets/day; monthly rebills grant 1 free
  # reset credit — credits not modeled yet).
  reset_fee_mode: "monthly_rebill"
  payout_fee: 0                       # Aeropay / prop-to-brokerage are free; ACH/wire $30 optional

risk_overrides:
  # Personal daily loss cap layered UNDER Topstep's DLL. Effective DLL used by
  # the simulator = min(enabled Topstep DLL, personal DLL).
  personal_dll_default: 1000
  personal_dll_allowed: [300, 500, 750, 1000]
  use_topstep_dll: true               # adding DLL at checkout: price discount + doubled payout caps

restrictions:
  # Temporary high-volatility contract caps in force as of 2026-07-02
  # (help.topstep.com article 13613539). GOLD IS CURRENTLY RESTRICTED.
  volatility_current:
    GC:  { max_minis:  { "50k": 3,  "100k": 6,  "150k": 9 } }
    MGC: { max_micros: { "50k": 30, "100k": 60, "150k": 90 } }

compliance:
  # Constraints the strategy layer must respect (from Prohibited Conduct /
  # Prohibited Trading Strategies articles):
  notes:
    - "Automated strategies allowed in Combine/XFA 'with conditions'; ProjectX API automation prohibited in LFA."
    - "Live order flow must come from a personal device: no VPS/VPN/remote servers."
    - "No SIM-exploit scalping: no second-scale hold times at hundreds of trades/day, no queue-position or zero-slippage exploitation."
    - "No full max-position entries directly into scheduled major news."
    - "No account stacking, cross-account hedging, or coordinated trading."
    - "Risk managers begin EOD flattening at 15:08 CT; treat 15:08 as the hard exit deadline."

objective:
  # Optimization target for later stages: maximize expected NET payout before
  # account failure — E[sum(0.9 * payouts) - subscriptions - activation -
  # resets] — NOT lifetime survival, NOT combine pass-rate alone.
  name: "max_expected_net_payout_before_failure"
  forbidden:
    - account_stacking_exploit
    - martingale
    - intentional_rule_violation
    - lookahead_bias
